  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for Retro Game SFX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>
  <!-- Google Fonts: Jua (Game Title), Noto Sans KR, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .font-game {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      letter-spacing: -0.02em;
    }

    .font-en {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
    }

    /* Background Village Themes */
    body.theme-day {
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 58%, #bae6fd 82%, #4ade80 82%, #22c55e 91%, #b45309 91%, #92400e 100%);
    }

    body.theme-night {
      background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #312e81 82%, #065f46 82%, #047857 91%, #451a03 91%, #270e02 100%);
    }

    body.theme-snow {
      background: linear-gradient(180deg, #0284c7 0%, #bae6fd 58%, #f0f9ff 82%, #ffffff 82%, #e2e8f0 91%, #64748b 91%, #475569 100%);
    }

    /* Retro Card & Button Styling */
    .card-retro {
      background: rgba(255, 255, 255, 0.96);
      border: 3px solid #1e293b;
      box-shadow: 0 4px 0 #1e293b;
    }

    .btn-retro {
      border: 2.5px solid #1e293b;
      box-shadow: 0 3px 0 #1e293b;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn-retro:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e293b;
    }

    /* Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animations */
    @keyframes floatCloud {
      0% { transform: translateX(-12%); }
      50% { transform: translateX(8%); }
      100% { transform: translateX(-12%); }
    }
    .cloud-anim-1 { animation: floatCloud 18s ease-in-out infinite; }
    .cloud-anim-2 { animation: floatCloud 24s ease-in-out infinite reverse; }

    @keyframes mascotIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .mascot-idle { animation: mascotIdle 2.2s ease-in-out infinite; }

    @keyframes mascotJump {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-16px) scale(1.08); }
      100% { transform: translateY(0) scale(1); }
    }
    .mascot-jump { animation: mascotJump 0.35s ease-out; }

    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-16deg); }
    }
    .wing-l { transform-origin: 22px 46px; animation: wingFlap 0.45s ease-in-out infinite; }
    .wing-r { transform-origin: 78px 46px; animation: wingFlap 0.45s ease-in-out infinite reverse; }

    @keyframes qBlockPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.06) rotate(-2deg); }
    }
    .q-block-anim { animation: qBlockPulse 1.8s ease-in-out infinite; }

    @keyframes coinPop {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      60% { opacity: 1; transform: translate(-50%, -45px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(0.95); }
    }
    .coin-float { animation: coinPop 0.9s ease-out forwards; }

    .app-shell {
      padding-top: max(8px, var(--sat));
      padding-bottom: max(6px, var(--sab));
    }
  </style>

<body id="app-body" class="theme-day">

  <!-- Decorative Super Mario Style Village Background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Clouds -->
    <svg class="cloud-anim-1 absolute top-14 left-4 w-28 h-14 opacity-90" viewBox="0 0 120 60">
      <path d="M25 50 H95 A18 18 0 0 0 95 16 A24 24 0 0 0 52 10 A20 20 0 0 0 25 50 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"></path>
      <rect x="46" y="26" width="3" height="9" rx="1.5" fill="#1e293b"></rect>
      <rect x="58" y="26" width="3" height="9" rx="1.5" fill="#1e293b"></rect>
    </svg>
    <svg class="cloud-anim-2 absolute top-28 right-3 w-24 h-12 opacity-80" viewBox="0 0 120 60">
      <path d="M25 50 H95 A18 18 0 0 0 95 16 A24 24 0 0 0 52 10 A20 20 0 0 0 25 50 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"></path>
    </svg>

    <!-- Bottom Green Hills & Warp Pipe -->
    <svg class="absolute bottom-[9%] left-0 w-full h-24" viewBox="0 0 400 100" preserveAspectRatio="none">
      <path d="M-10 100 Q55 15 120 100 Z" fill="#16a34a" stroke="#1e293b" stroke-width="3"></path>
      <path d="M260 100 Q335 25 410 100 Z" fill="#15803d" stroke="#1e293b" stroke-width="3"></path>
      <!-- Green Warp Pipe -->
      <rect x="326" y="54" width="36" height="46" fill="#22c55e" stroke="#1e293b" stroke-width="3"></rect>
      <rect x="321" y="44" width="46" height="12" rx="3" fill="#4ade80" stroke="#1e293b" stroke-width="3"></rect>
    </svg>
  </div>

  <!-- Main App Shell (100dvh Full Screen Mobile Layout) -->
  <div class="app-shell relative z-10 w-full max-w-lg mx-auto h-full flex flex-col">

    <!-- Top Retro Game HUD Header -->
    <header class="px-3 pb-2 shrink-0">
      <div class="card-retro rounded-2xl px-2.5 py-2 flex items-center justify-between gap-1.5 bg-white/95">
        <!-- Left: Back/Home + Level & Title -->
        <div class="flex items-center gap-1.5 min-w-0">
          <button id="btn-home-nav" onclick="goHome()" class="hidden btn-retro bg-amber-300 hover:bg-amber-200 px-2 py-1 rounded-xl text-xs font-black text-slate-900 shrink-0" title="월드맵으로">
            🏠 맵
          </button>
          <div class="min-w-0">
            <div class="flex items-center gap-1">
              <span id="hud-level" class="font-game text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-lg">LV.1</span>
              <span id="hud-title" class="font-bold text-[11px] text-slate-800 truncate">🌱 초보 모험가</span>
            </div>
          </div>
        </div>

        <!-- Right: Coins, Shop, Stats, Backup, Add, Sound -->
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="openModal('shop')" class="btn-retro bg-amber-300 hover:bg-amber-200 px-2 py-1 rounded-xl flex items-center gap-1 text-xs font-black text-slate-900" title="마을 코인 상점">
            <span>🪙</span>
            <span id="hud-coins" class="font-game">0</span>
          </button>
          <button onclick="openModal('shop')" class="btn-retro bg-rose-400 text-white w-8 h-8 rounded-xl flex items-center justify-center text-sm" title="코인 상점">🏪</button>
          <button onclick="openModal('stats')" class="btn-retro bg-sky-400 text-white w-8 h-8 rounded-xl flex items-center justify-center text-sm" title="학습 트래킹 &amp; 오답노트">📊</button>
          <button onclick="openModal('backup')" class="btn-retro bg-emerald-400 text-white w-8 h-8 rounded-xl flex items-center justify-center text-sm" title="백업 및 복원">💾</button>
          <button onclick="openModal('add')" class="btn-retro bg-violet-500 text-white w-8 h-8 rounded-xl flex items-center justify-center text-sm font-black" title="나만의 단어/문장 추가">＋</button>
          <button id="btn-sfx" onclick="toggleSfx()" class="btn-retro bg-slate-100 text-slate-800 w-8 h-8 rounded-xl flex items-center justify-center text-sm" title="게임 효과음">🔔</button>
        </div>
      </div>
    </header>

    <!-- Scrollable Main View Container -->
    <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar px-3 pb-4">
    <div class="space-y-3 pt-1">
      <!-- Mascot Cheer & Question Bonus Block -->
      <div class="card-retro rounded-3xl p-3.5 flex items-center gap-3 relative overflow-hidden">
        <div id="mascot-box" onclick="pokeMascot()" class="w-20 h-20 shrink-0 cursor-pointer mascot-idle">
          
    <svg viewBox="0 0 100 100" class="w-full h-full">
      <g class="wing-l"><ellipse cx="14" cy="46" rx="10" ry="6" fill="#fff" stroke="#1e293b" stroke-width="2.5"></ellipse></g>
      <g class="wing-r"><ellipse cx="86" cy="46" rx="10" ry="6" fill="#fff" stroke="#1e293b" stroke-width="2.5"></ellipse></g>
      <circle cx="50" cy="54" r="32" fill="#fde68a" stroke="#1e293b" stroke-width="3.5"></circle>
      <path d="M22 44 Q50 18 78 44" fill="#6366f1" stroke="#1e293b" stroke-width="3"></path>
      
      <rect x="27" y="39" width="21" height="17" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="3"></rect>
      <rect x="52" y="39" width="21" height="17" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="3"></rect>
      <line x1="48" y1="47" x2="52" y2="47" stroke="#1e293b" stroke-width="3"></line>
      <path d="M34 48 Q40 42 46 48" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"></path><path d="M54 48 Q60 42 66 48" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="31" cy="62" r="4" fill="#fb7185" opacity="0.7"></circle>
      <circle cx="69" cy="62" r="4" fill="#fb7185" opacity="0.7"></circle>
      <path d="M43 66 Q50 74 57 66" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"></path>
    </svg>
  
        </div>
        <div onclick="pokeMascot()" class="flex-1 min-w-0 cursor-pointer">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[10px] font-black bg-rose-500 text-white px-2 py-0.5 rounded-full">에이미짱</span>
            <span class="text-[10px] font-bold text-slate-500">터치해서 응원 듣기 🔊</span>
          </div>
          <p id="mascot-en" class="font-en font-bold text-sm text-indigo-900 leading-snug">"You're doing awesome! Keep going!"</p>
          <p id="mascot-ko" class="text-xs font-bold text-slate-600 mt-0.5">정말 잘하고 있어요! 계속 나아가요!</p>
        </div>
        <button onclick="hitQuestionBlock()" class="q-block-anim w-12 h-12 rounded-2xl bg-gradient-to-b from-amber-300 to-amber-500 border-3 border-slate-900 shadow-md flex flex-col items-center justify-center shrink-0 active:scale-90" title="보너스 코인 블록">
          <span class="font-game text-2xl leading-none text-white drop-shadow-[0_2px_0_#78350f]">?</span>
          <span class="text-[9px] font-black text-amber-950">+5🪙</span>
        </button>
      </div>

      <!-- Subway Commute Quick Tools (5-Min SRS + Audio Loop) -->
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="openView('quick_srs')" class="btn-retro rounded-2xl p-3 bg-gradient-to-br from-amber-300 to-orange-400 text-left relative">
          <div class="flex items-center justify-between">
            <span class="text-xl">⚡</span>
            <span class="text-[10px] font-black bg-slate-900 text-amber-300 px-2 py-0.5 rounded-full">15개 대기</span>

<script>
/* ==========================================================================
   1. TRIPLE PERSISTENT STORAGE (localStorage + IndexedDB + window.name)
   ========================================================================== */
const STORAGE_KEY = 'english_master_rpg_clean_v1';
const IDB_NAME = 'EnglishMasterRPG_CleanDB';
const IDB_STORE = 'state_store';
const IDB_KEY = 'main_state';

function getTodayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const DEFAULT_STATE = {
  coins: 0,
  exp: 0,
  streak: 1,
  lastStudyDate: getTodayDateStr(),
  sfxEnabled: true,
  theme: 'theme-day',
  equippedCosmetic: 'none',
  unlockedCosmetics: ['none'],
  unlockedThemes: ['theme-day'],
  hintPotions: 2,
  masteredIds: [],
  srsData: {},
  activityLog: { [getTodayDateStr()]: 1 },
  customWords: [],
  customPhrases: []
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let stateHydrated = false;

function readSyncState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try {
    if (window.name && window.name.startsWith('EMRPG:')) {
      return JSON.parse(window.name.slice(6));
    }
  } catch (e) {}
  return null;
}

function writeSyncState(obj) {
  try {
    const str = JSON.stringify(obj);
    localStorage.setItem(STORAGE_KEY, str);
    window.name = 'EMRPG:' + str;
  } catch (e) {}
}

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject('No IDB');
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveToIDB(data) {
  try {
    const db = await openIDB();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(data, IDB_KEY);
  } catch (e) {}
}

async function loadFromIDB() {
  try {
    const db = await openIDB();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

function saveState() {
  if (!stateHydrated) return;
  const today = getTodayDateStr();
  if (state.lastStudyDate !== today) {
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const yStr = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
    state.streak = state.lastStudyDate === yStr ? state.streak + 1 : 1;
    state.lastStudyDate = today;
  }
  state.activityLog[today] = (state.activityLog[today] || 0) + 1;
  writeSyncState(state);
  saveToIDB(state);
  updateHUD();
}

async function loadState() {
  const syncObj = readSyncState();
  const idbObj = await loadFromIDB();

  if (syncObj || idbObj) {
    const base = syncObj || idbObj;
    const other = idbObj || syncObj;
    state = {
      ...DEFAULT_STATE,
      ...base,
      coins: Math.max(base.coins || 0, other.coins || 0),
      exp: Math.max(base.exp || 0, other.exp || 0),
      streak: Math.max(base.streak || 1, other.streak || 1),
      masteredIds: Array.from(new Set([...(base.masteredIds || []), ...(other.masteredIds || [])])),
      unlockedCosmetics: Array.from(new Set(['none', ...(base.unlockedCosmetics || []), ...(other.unlockedCosmetics || [])])),
      unlockedThemes: Array.from(new Set(['theme-day', ...(base.unlockedThemes || []), ...(other.unlockedThemes || [])])),
      srsData: { ...(other.srsData || {}), ...(base.srsData || {}) },
      customWords: (base.customWords && base.customWords.length >= (other.customWords || []).length) ? base.customWords : (other.customWords || []),
      customPhrases: (base.customPhrases && base.customPhrases.length >= (other.customPhrases || []).length) ? base.customPhrases : (other.customPhrases || [])
    };
  }
  stateHydrated = true;
  applyTheme(state.theme, false);
  updateHUD();
}

window.addEventListener('pagehide', () => {
  if (stateHydrated) writeSyncState(state);
});

/* ==========================================================================
   2. SOUND EFFECTS (Tone.js) & NATIVE TTS (en-US / ko-KR)
   ========================================================================== */
function playSfx(type) {
  if (!state.sfxEnabled || typeof Tone === 'undefined') return;
  try {
    if (Tone.context.state !== 'running') Tone.start();
    const synth = new Tone.Synth({
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.01, decay: 0.12, sustain: 0.05, release: 0.15 }
    }).toDestination();
    const now = Tone.now();
    if (type === 'coin') {
      synth.triggerAttackRelease('B5', '16n', now);
      synth.triggerAttackRelease('E6', '8n', now + 0.08);
    } else if (type === 'correct') {
      synth.triggerAttackRelease('C5', '16n', now);
      synth.triggerAttackRelease('E5', '16n', now + 0.07);
      synth.triggerAttackRelease('G5', '8n', now + 0.14);
    } else if (type === 'wrong') {
      synth.triggerAttackRelease('E3', '8n', now);
      synth.triggerAttackRelease('C3', '4n', now + 0.1);
    } else if (type === 'powerup') {
      ['C5', 'E5', 'G5', 'C6'].forEach((n, i) => synth.triggerAttackRelease(n, '16n', now + i * 0.06));
    } else {
      synth.triggerAttackRelease('G5', '32n', now);
    }
  } catch (e) {}
}

function toggleSfx() {
  state.sfxEnabled = !state.sfxEnabled;
  saveState();
  showToast(state.sfxEnabled ? '🔔 게임 효과음 ON' : '🔇 게임 효과음 OFF');
}

function speakEn(text, rate = 0.95, onEnd = null) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.includes('en-US') && (v.name.includes('Samantha') || v.name.includes('Google') || v.name.includes('Natural'))) || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

function speakKo(text, onEnd = null) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 1.05;
  if (onEnd) utter.onend = onEnd;
  window.speechSynthesis.speak(utter);
}

let currentView = 'home';

function showToast(msg) {
  const box = document.getElementById('toast-box');
  const text = document.getElementById('toast-msg');
  if (!box || !text) return;
  text.textContent = msg;
  box.classList.remove('opacity-0');
  box.classList.add('opacity-100');
  clearTimeout(box._timer);
  box._timer = setTimeout(() => {
    box.classList.remove('opacity-100');
    box.classList.add('opacity-0');
  }, 2200);
}

function showFloatingCoin(text = '+10 🪙') {
  const layer = document.getElementById('fx-layer');
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'coin-float fixed left-1/2 top-1/3 -translate-x-1/2 font-game text-xl text-amber-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.85)]';
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function awardCoins(amount, expGain = 10) {
  state.coins = (state.coins || 0) + amount;
  state.exp = (state.exp || 0) + expGain;
  playSfx('coin');
  showFloatingCoin(`+${amount} 🪙`);
  saveState();
}

function getLevelInfo() {
  const lv = Math.floor((state.exp || 0) / 100) + 1;
  let title = '🌱 초보 모험가';
  if (lv >= 15) title = '👑 영어 마스터';
  else if (lv >= 8) title = '🗣️ 원어민급 수다쟁이';
  else if (lv >= 3) title = '✈️ 뉴욕 여행자';
  return { lv, title };
}

function updateHUD() {
  const { lv, title } = getLevelInfo();
  const lvEl = document.getElementById('hud-level');
  const titleEl = document.getElementById('hud-title');
  const coinEl = document.getElementById('hud-coins');
  const sfxEl = document.getElementById('btn-sfx');
  const homeBtn = document.getElementById('btn-home-nav');
  if (lvEl) lvEl.textContent = `LV.${lv}`;
  if (titleEl) titleEl.textContent = title;
  if (coinEl) coinEl.textContent = state.coins || 0;
  if (sfxEl) sfxEl.textContent = state.sfxEnabled ? '🔔' : '🔇';
  if (homeBtn) homeBtn.classList.toggle('hidden', currentView === 'home');
}

function applyTheme(themeClass, persist = true) {
  const body = document.getElementById('app-body');
  if (body) {
    body.classList.remove('theme-day', 'theme-night', 'theme-snow');
    body.classList.add(themeClass || 'theme-day');
  }
  state.theme = themeClass || 'theme-day';
  if (persist) saveState();
}

function goHome() {
  stopAudioLoop();
  currentView = 'home';
  viewParams = {};
  updateHUD();
  renderCurrentView();
}

function openView(viewName, params = {}) {
  stopAudioLoop();
  playSfx('tap');
  currentView = viewName;
  viewParams = params;
  updateHUD();
  renderCurrentView();
  const main = document.getElementById('main-content');
  if (main) main.scrollTop = 0;
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.classList.add('hidden');
}

function closeModalOnBackdrop(event) {
  if (event && event.target && event.target.id === 'modal-overlay') {

}

function toggleMastered(id) {
  const idx = state.masteredIds.indexOf(id);
  if (idx === -1) {
    state.masteredIds.push(id);
    awardCoins(5, 10);
    showToast('✅ 암기 완료! +5 코인');
  } else {
    state.masteredIds.splice(idx, 1);
    saveState();
    showToast('🔄 암기 체크 해제됨');
  }
  renderCurrentView();
}

function recordSrsResult(id, isCorrect) {
  const prev = state.srsData[id] || { interval: 0, wrongCount: 0, nextDue: 0 };
  const now = Date.now();
  if (isCorrect) {
    const nextInt = prev.interval === 0 ? 1 : prev.interval === 1 ? 3 : prev.interval === 3 ? 7 : 14;
    state.srsData[id] = {
      interval: nextInt,
      wrongCount: prev.wrongCount || 0,
      nextDue: now + nextInt * 86400000
    };
  } else {
    state.srsData[id] = {
      interval: 0,
      wrongCount: (prev.wrongCount || 0) + 1,
      nextDue: now
    };
  }
  saveState();
}

function getAllStudyItems() {
  const words = [...WORDS_DATA, ...(state.customWords || [])].map(w => ({
    id: w.id,
    front: w.en,
    read: w.koRead || '',
    back: w.ko,
    sub: w.ex || ''
  }));
  const phrases = [...PHRASES_DATA, ...(state.customPhrases || [])].map(p => ({
    id: p.id,
    front: p.politeEn,
    read: p.politeKoRead || '',
    back: p.ko,
    sub: p.casualEn ? `🗣️ 친구: ${p.casualEn}` : ''
  }));
  const signs = SIGN_PHRASAL_DATA.map(s => ({
    id: s.id,
    front: s.en,
    read: s.koRead,
    back: s.ko,
    sub: s.tip
  }));
  return [...words, ...phrases, ...signs];
}

function getDueSrsItems() {
  const all = getAllStudyItems();
  const now = Date.now();
  const due = all.filter(item => {
    const rec = state.srsData[item.id];
    if (!rec) return !state.masteredIds.includes(item.id);
    return rec.nextDue <= now || rec.wrongCount > 0;
  });
  return due.length > 0 ? due.slice(0, 15) : all.slice(0, 10);
}

function getWorldStars(worldNum) {
  let ids = [];
  if (worldNum === 1) ids = PHONICS_DATA.map(x => x.id);
  else if (worldNum === 2) ids = SIGN_PHRASAL_DATA.map(x => x.id);
  else if (worldNum === 3) ids = WORDS_DATA.map(x => x.id);
  else if (worldNum === 4) ids = PHRASES_DATA.map(x => x.id);
  else if (worldNum === 5) ids = GRAMMAR_DATA.map(x => x.id);
  if (!ids.length) return 0;
  const done = ids.filter(id => state.masteredIds.includes(id)).length;
  const ratio = done / ids.length;
  if (ratio >= 0.8) return 3;
  if (ratio >= 0.4) return 2;
  if (done >= 1) return 1;
  return 0;
}

function renderStars(count) {
  return '★'.repeat(count) + '☆'.repeat(3 - count);
}

function buyPotion() {
  if (state.coins < 15) return showToast('🪙 코인이 부족합니다! (15 코인 필요)');
  state.coins -= 15;
  state.hintPotions = (state.hintPotions || 0) + 1;
  playSfx('powerup');
  saveState();
  openModal('shop');
  showToast('💡 50:50 힌트 물약 구매 완료!');
}

function buyOrEquipCosmetic(id, price) {
  if (!state.unlockedCosmetics.includes(id)) {
    if (state.coins < price) return showToast(`🪙 코인이 부족합니다! (${price} 코인 필요)`);
    state.coins -= price;
    state.unlockedCosmetics.push(id);
    playSfx('powerup');
  } else {
    playSfx('tap');
  }
  state.equippedCosmetic = id;
  saveState();
  openModal('shop');
  if (currentView === 'home') renderCurrentView();
  showToast('🎀 코스튬이 적용되었습니다!');
}

function buyOrEquipTheme(id, price) {
  if (!state.unlockedThemes.includes(id)) {
    if (state.coins < price) return showToast(`🪙 코인이 부족합니다! (${price} 코인 필요)`);
    state.coins -= price;
    state.unlockedThemes.push(id);
    playSfx('powerup');
  } else {
    playSfx('tap');
  }
  applyTheme(id, true);
  openModal('shop');
  showToast('🗺️ 마을 배경 테마가 변경되었습니다!');
}

function clearWrongItem(id) {
  if (state.srsData[id]) {
    state.srsData[id].wrongCount = 0;
    state.srsData[id].nextDue = Date.now() + 86400000;
    saveState();
    openModal('stats');
    showToast('✅ 오답노트에서 복습 완료 처리되었습니다!');
  }
}

function copyBackupCode() {
  const ta = document.getElementById('backup-textarea');
  if (!ta) return;
  ta.select();
  try {
    document.execCommand('copy');
    showToast('📋 백업 코드가 클립보드에 복사되었습니다!');
  } catch (e) {
    showToast('코드를 길게 눌러 복사해 주세요.');
  }
}

function getCleanFullHtml() {
  const overlay = document.getElementById('modal-overlay');
  const toast = document.getElementById('toast-box');
  const wasModalOpen = overlay && !overlay.classList.contains('hidden');
  if (overlay) overlay.classList.add('hidden');
  if (toast) {
    toast.classList.remove('opacity-100');
    toast.classList.add('opacity-0');
  }

  const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  if (wasModalOpen && overlay) overlay.classList.remove('hidden');
  return htmlContent;
}

function copyFullHtmlCode() {
  try {
    const htmlContent = getCleanFullHtml();
    const tempTa = document.createElement('textarea');
    tempTa.value = htmlContent;
    tempTa.style.position = 'fixed';
    tempTa.style.left = '-9999px';
    document.body.appendChild(tempTa);
    tempTa.focus();
    tempTa.select();
    tempTa.setSelectionRange(0, htmlContent.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(tempTa);
    if (ok) {
      showToast('✅ 전체 코드가 복사되었습니다! 이제 GitHub에 붙여넣기 하세요.');
    } else {
      showToast('⚠️ 복사에 실패했습니다. 아래 파일 다운로드를 이용해 주세요.');
    }
  } catch (e) {
    showToast('⚠️ 복사에 실패했습니다. 아래 파일 다운로드를 이용해 주세요.');
  }
}

function downloadSelfHtml() {
  try {
    const htmlContent = getCleanFullHtml();

    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('⬇️ 깨끗한 메인화면 버전 index.html 다운로드 완료!');
  } catch (e) {
    showToast('⚠️ 브라우저에서 다운로드를 지원하지 않으면 코드를 복사해 주세요.');
  }
}

function restoreBackupCode() {
  const ta = document.getElementById('backup-textarea');
  if (!ta || !ta.value.trim()) return;
  try {
    const jsonStr = decodeURIComponent(escape(atob(ta.value.trim())));
    const parsed = JSON.parse(jsonStr);
    if (parsed && typeof parsed === 'object') {
      state = { ...DEFAULT_STATE, ...parsed };
      applyTheme(state.theme, false);
      saveState();
      closeModal();
      renderCurrentView();
      showToast('🎉 학습 데이터가 성공적으로 복원되었습니다!');
    }
  } catch (e) {
    showToast('⚠️ 올바른 백업 코드가 아닙니다.');
  }
}

function saveCustomEntry() {
  const en = (document.getElementById('custom-en')?.value || '').trim();
  const read = (document.getElementById('custom-read')?.value || '').trim();
  const ko = (document.getElementById('custom-ko')?.value || '').trim();
  if (!en || !ko) return showToast('영어 표현과 한국어 뜻을 모두 입력해 주세요.');
  state.customWords.unshift({
    id: 'cw_' + Date.now(),
    cat: 'daily',
    en,
    koRead: read,
    ko,
    ex: '나만의 등록 표현'
  });
  awardCoins(10, 15);
  closeModal();
  renderCurrentView();
  showToast('✨ 나만의 단어장에 등록되었습니다!');
}

  else if (currentView === 'world1') renderWorld1View(container);
  else if (currentView === 'world2') renderWorld2View(container);

  else if (currentView === 'quick_srs') renderQuickSrsView(container);
  else if (currentView === 'audio_loop') renderAudioLoopView(container);
  else if (currentView === 'quiz') renderQuizView(container);
}

function pickBlock(poolIdx) {
  const pool = [...(viewParams._pool || [])];
  const picked = [...(viewParams._picked || [])];
  const word = pool[poolIdx];
  if (word === null) return;
  pool[poolIdx] = null;
  picked.push(word);
  playSfx('tap');
  openView('world4', { mode: 'blocks', bIdx: viewParams.bIdx || 0, pool, picked });
}

function unpickBlock(pickedIdx) {
  const pool = [...(viewParams._pool || [])];
  const picked = [...(viewParams._picked || [])];
  const word = picked.splice(pickedIdx, 1)[0];
  const emptyIdx = pool.indexOf(null);
  if (emptyIdx !== -1) pool[emptyIdx] = word;
  else pool.push(word);
  playSfx('tap');
  openView('world4', { mode: 'blocks', bIdx: viewParams.bIdx || 0, pool, picked });
}

function checkBlockSentence(idx) {
  const item = PHRASES_DATA[idx % PHRASES_DATA.length];
  const picked = viewParams._picked || [];
  if (picked.join(' ') === item.blocks.join(' ')) {
    awardCoins(15, 20);
    speakEn(picked.join(' '));
    showToast('🎉 완벽한 어순입니다! +15 코인');
    openView('world4', { mode: 'blocks', bIdx: idx + 1 });
  } else {
    playSfx('wrong');
    showToast('😅 순서가 조금 달라요! 다시 확인해 보세요.');
  }
}

function answerDialogueTurn(sIdx, tIdx, optIdx) {
  const scenario = DIALOGUE_SCENARIOS[sIdx % DIALOGUE_SCENARIOS.length];
  const turn = scenario.turns[tIdx];
  const chosen = turn.options[optIdx];
  if (chosen.correct) {
    awardCoins(10, 15);
    speakEn(chosen.en);
    if (tIdx + 1 < scenario.turns.length) {
      openView('world4', { mode: 'dialogue', sIdx, tIdx: tIdx + 1 });
    } else {
      showToast('🏆 실전 대화 시나리오 클리어! +10 코인');
      openView('world4', { mode: 'dialogue', sIdx: sIdx + 1, tIdx: 0 });
    }
  } else {
    playSfx('wrong');

  if (subMode === 'lesson') {
    const rules = chId === 'all' ? GRAMMAR_DATA : GRAMMAR_DATA.filter(g => g.cat === chId);
    subBody.innerHTML = `
      <div class="space-y-2.5">

    const sIdx = viewParams.sIdx || 0;
    const item = activePool[sIdx % activePool.length];

    let slotHtml = '';
    for (let i = 0; i <= item.slots.length; i++) {
      slotHtml += `<button onclick="checkOrderSniper('${chId}', ${sIdx}, ${i})" class="px-2 py-1 rounded-lg bg-amber-200 hover:bg-amber-400 border-2 border-dashed border-amber-600 font-black text-xs text-amber-900">[${i + 1}]</button>`;
      if (i < item.slots.length) {
        slotHtml += `<span class="font-en font-bold text-sm text-slate-900">${item.slots[i]}</span>`;
      }
    }

    subBody.innerHTML = `
      <div class="card-retro rounded-2xl p-4 space-y-3">

          <span class="font-game text-xs text-amber-700">🎯 어순 스나이퍼 (${(sIdx % activePool.length) + 1}/${activePool.length})</span>

    const qIdx = viewParams.qIdx || 0;
    const q = activePool[qIdx % activePool.length];

function checkOrderSniper(chId, sIdx, chosenSlot) {
  const pool = ORDER_SNIPER_DATA.filter(s => chId === 'all' || s.cat === chId);
  const activePool = pool.length > 0 ? pool : ORDER_SNIPER_DATA;
  const item = activePool[sIdx % activePool.length];
  if (chosenSlot === item.correctSlot) {
    awardCoins(15, 20);
    const fullSentence = [...item.slots.slice(0, chosenSlot), item.targetWord, ...item.slots.slice(chosenSlot)].join(' ');
    speakEn(fullSentence);
    showToast(`🎯 명중! ${item.explain}`);
    openView('world5', { ch: chId, sub: 'sniper', sIdx: sIdx + 1 });
  } else {
    playSfx('wrong');
    showToast(`❌ 빗나갔어요! ${item.explain}`);
  }
}

function useGrammarHint(chId, qIdx) {
  if ((state.hintPotions || 0) <= 0) return showToast('💡 힌트 물약이 없습니다. 상점에서 구매해 주세요!');
  const pool = GRAMMAR_QUIZ_DATA.filter(q => chId === 'all' || q.cat === chId);
  const activePool = pool.length > 0 ? pool : GRAMMAR_QUIZ_DATA;
  const q = activePool[qIdx % activePool.length];
  const wrongIndices = q.options.map((o, i) => (!o.correct ? i : -1)).filter(i => i !== -1);
  state.hintPotions -= 1;
  saveState();
  openView('world5', { ch: chId, sub: 'quiz', qIdx, hiddenOpts: wrongIndices.slice(0, 2) });
  showToast('💡 오답 2개를 제거했습니다!');
}

function answerGrammarQuiz(chId, qIdx, optIdx) {
  const pool = GRAMMAR_QUIZ_DATA.filter(q => chId === 'all' || q.cat === chId);
  const activePool = pool.length > 0 ? pool : GRAMMAR_QUIZ_DATA;
  const q = activePool[qIdx % activePool.length];
  if (q.options[optIdx].correct) {
    awardCoins(15, 20);
    showToast('🎉 정답입니다! +15 코인');
    openView('world5', { ch: chId, sub: 'quiz', qIdx: qIdx + 1, hiddenOpts: [] });
  } else {
    playSfx('wrong');
    showToast('😅 아쉽습니다! 공식을 다시 떠올려 보세요.');
  }
}

      </div>

      <div onclick="openView('quick_srs', { idx: ${idx}, flipped: ${!flipped} })" class="card-retro rounded-3xl p-6 min-h-[210px] flex flex-col items-center justify-center text-center cursor-pointer bg-white">

function handleSrsSwipe(id, remembered, idx) {
  recordSrsResult(id, remembered);
  if (remembered) awardCoins(5, 10);
  else playSfx('tap');
  openView('quick_srs', { idx: idx + 1, flipped: false });
}

function renderAudioLoopView(container) {
  const items = getAllStudyItems();
  const current = items[audioLoopIdx % items.length];

  container.innerHTML = `
    <div class="space-y-3 pt-1">
      <div class="card-retro rounded-2xl p-4 text-center space-y-3">
        <span class="text-[10px] font-black bg-cyan-600 text-white px-2.5 py-0.5 rounded-full">🎧 지하철·출퇴근 무화면 오디오 루프</span>
        <h2 class="font-game text-base text-slate-900">한국어 뜻 → 1.5초 생각 → 느리게 → 보통 속도</h2>
        <div class="p-4 rounded-2xl bg-sky-50 border-2 border-sky-200 min-h-[120px] flex flex-col justify-center">
          <div id="loop-status" class="text-xs font-black text-sky-700 mb-1">${audioLoopRunning ? '▶️ 자동 루프 재생 중...' : '⏸️ 대기 중'}</div>
          <div id="loop-en" class="font-en font-extrabold text-lg text-slate-900">${current.front}</div>
          <div id="loop-ko" class="text-xs font-bold text-slate-600 mt-1">${current.back}</div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="startAudioLoop()" class="btn-retro bg-emerald-500 text-white py-3 rounded-2xl font-game text-sm">▶️ 루프 시작</button>
          <button onclick="stopAudioLoop(); renderCurrentView();" class="btn-retro bg-rose-500 text-white py-3 rounded-2xl font-game text-sm">⏹️ 정지</button>
        </div>
      </div>
    </div>
  `;
}

function startAudioLoop() {
  if (audioLoopRunning) return;
  audioLoopRunning = true;
  playSfx('tap');
  runAudioLoopStep();
}

function stopAudioLoop() {
  audioLoopRunning = false;
  clearTimeout(audioLoopTimer);
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function runAudioLoopStep() {
  if (!audioLoopRunning) return;
  const items = getAllStudyItems();
  const item = items[audioLoopIdx % items.length];
  const enEl = document.getElementById('loop-en');
  const koEl = document.getElementById('loop-ko');
  const stEl = document.getElementById('loop-status');
  if (enEl) enEl.textContent = item.front;
  if (koEl) koEl.textContent = item.back;
  if (stEl) stEl.textContent = `1️⃣ 한국어 뜻 (${(audioLoopIdx % items.length) + 1}/${items.length})`;

  speakKo(item.back, () => {
    if (!audioLoopRunning) return;
    if (stEl) stEl.textContent = '2️⃣ 머릿속으로 영작해 보세요 (1.5초)...';
    audioLoopTimer = setTimeout(() => {
      if (!audioLoopRunning) return;
      if (stEl) stEl.textContent = '3️⃣ 원어민 느린 속도 (0.72x)';
      speakEn(item.front, 0.72, () => {
        if (!audioLoopRunning) return;
        if (stEl) stEl.textContent = '4️⃣ 원어민 자연 속도 (1.0x)';
        speakEn(item.front, 1.0, () => {
          if (!audioLoopRunning) return;
          audioLoopIdx += 1;
          audioLoopTimer = setTimeout(runAudioLoopStep, 900);
        });
      });
    }, 1500);
  });
}

function startGenericQuiz(source) {
  openView('quiz', { source, qIdx: 0 });
}

function renderQuizView(container) {
  const source = viewParams.source || 'world3';
  const qIdx = viewParams.qIdx || 0;
  let pool = [];
  if (source === 'world1') {
    pool = PHONICS_DATA.map(p => ({ id: p.id, prompt: p.example, sub: p.tip, answer: p.ko, allAnswers: PHONICS_DATA.map(x => x.ko) }));
  } else if (source === 'world2') {
    pool = SIGN_PHRASAL_DATA.map(s => ({ id: s.id, prompt: s.en, sub: `[${s.koRead}]`, answer: s.ko, allAnswers: SIGN_PHRASAL_DATA.map(x => x.ko) }));
  } else {
    pool = WORDS_DATA.map(w => ({ id: w.id, prompt: w.en, sub: `[${w.koRead}]`, answer: w.ko, allAnswers: WORDS_DATA.map(x => x.ko) }));
  }

  const item = pool[qIdx % pool.length];
  const distractors = item.allAnswers.filter(a => a !== item.answer).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [item.answer, ...distractors].sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div class="space-y-3 pt-1">
      <div class="card-retro rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="font-game text-xs text-indigo-700">🎯 실전 스피드 퀴즈 (${(qIdx % pool.length) + 1}/${pool.length})</span>
          <button onclick="speakEn('${item.prompt.replace(/'/g, "\\'")}')" class="btn-retro bg-amber-300 px-2.5 py-1 rounded-xl text-xs font-bold">🔊 발음 듣기</button>
        </div>
        <div class="p-4 rounded-2xl bg-slate-900 text-white text-center">
          <div class="font-en font-extrabold text-xl">${item.prompt}</div>
          <div class="text-xs text-amber-300 mt-1">${item.sub}</div>
        </div>
        <div class="space-y-2">
          ${options.map(opt => `
            <button onclick="submitGenericQuiz('${source}', ${qIdx}, '${item.id}', '${opt.replace(/'/g, "\\'")}', '${item.answer.replace(/'/g, "\\'")}')" class="btn-retro w-full p-3 rounded-2xl bg-white hover:bg-indigo-50 text-left font-bold text-xs text-slate-900">${opt}</button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function submitGenericQuiz(source, qIdx, id, chosen, answer) {
  const isCorrect = chosen === answer;
  recordSrsResult(id, isCorrect);
  if (isCorrect) {
    awardCoins(10, 15);
    showToast('🎉 정답! +10 코인');
    openView('quiz', { source, qIdx: qIdx + 1 });
  } else {
    playSfx('wrong');
    showToast(`❌ 오답! 정답: ${answer}`);
  }
}
